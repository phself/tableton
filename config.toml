[customizations.installer.kickstart]
contents = """
lang en_US.UTF-8
keyboard us
timezone Asia/Jerusalem
graphical
reboot

bootloader --timeout=3

# Optimized Partitioning for 2TB Storage
zerombr
clearpart --all --initlabel --disklabel=gpt

# 1. EFI Partition (Standard)
part /boot/efi --fstype="efi"  --size=600

# 2. Boot Partition (Generous for bootc rollbacks)
part /boot     --fstype="ext4" --size=2048

# 3. Swap Partition (Crucial for running Windows VMs)
# Since you have 2TB, 16GB of swap is a safe safety net
part swap      --fstype="swap" --size=16384

# 4. Root Partition (Everything else)
# This uses the remaining ~1.9 TB
part /         --fstype="ext4" --size=102400 --grow

rootpw --iscrypted $6$442xLFU3Mvzrl.r9$Ev5jc23HcH44bXlz9TE4NBTndnoUwVBDNA0ULZlQTcMAktfciRRzGfRAIfm8UZokDN1jo02Y16kqiTA98EXRm1

network --bootproto=dhcp --device=link --activate --onboot=on --hostname=tableton

# Configure bootc to install from the local embedded container repository.
#ostreecontainer --transport oci --url /run/install/repo/container

%post --log=/dev/console --erroronfail

# Update the image reference for updates to work correctly.
bootc switch --mutate-in-place --apply hub-registry.apps.mgmt.cloudlet.tng.topsecret/tableton/tableton:latest

%end
"""
